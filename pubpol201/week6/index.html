<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia Night</title>
<style>
  :root{
    --bg:#0B1622; --panel:#121F2E; --line:#22374d; --ink:#E6EDF3; --dim:#BCCAD8;
    --muted:#8296A8; --maize:#FFCB05; --amber:#E8A33D; --green:#4FB477; --red:#E0745C;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
       font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--maize);outline-offset:2px}
  .hidden{display:none !important}

  /* the countdown: a bar that drains across the top, plus the big number */
  #bar{flex:none;height:14px;background:var(--panel)}
  #barFill{height:100%;width:0;background:var(--maize);transition:width .25s linear}
  #barFill.low{background:var(--amber)}

  #stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2.4vh;padding:2.4vh 4vw 1.6vh}

  .head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:2vw}
  .where{color:var(--muted);font-size:clamp(1rem,1.7vw,1.7rem)}
  .clock{font-size:clamp(2.6rem,min(7.5vw,12vh),7rem);font-weight:800;line-height:1;color:var(--maize);
         font-variant-numeric:tabular-nums}
  .clock.low{color:var(--amber)}
  .clock.paused{color:var(--muted)}
  .clock.done{opacity:.15}

  .question{flex:none;max-width:46ch;font-size:clamp(1.4rem,min(3.4vw,5.6vh),3.4rem);font-weight:700;line-height:1.2}
  .question.long{font-size:clamp(1.25rem,min(2.8vw,4.6vh),2.8rem)}
  .question.final{font-size:clamp(1.9rem,4.4vw,4.4rem);margin-top:2vh}
  .finalbody{flex:none;display:flex;align-items:center;gap:3vw;margin-top:2vh}
  .finalbody .question.final{flex:1;margin-top:0;font-size:clamp(1.6rem,min(3.6vw,6vh),3.8rem)}
  .clue{flex:none;max-width:40vw;max-height:44vh;border-radius:12px;border:1px solid var(--line)}

  .opts{flex:1 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:1.6vw}
  .opts.long .opt{font-size:clamp(1rem,min(2vw,3.3vh),2.1rem)}
  .opts.longer .opt{font-size:clamp(.9rem,min(1.65vw,2.8vh),1.75rem)}
  .opt{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:1.4vw;row-gap:1.2vh;
       padding:min(1.2vw,2vh) 1.8vw;background:var(--panel);border:3px solid var(--line);border-radius:14px;
       font-size:clamp(1.1rem,min(2.5vw,4vh),2.6rem);transition:opacity .35s,border-color .35s}
  .opt.pick{outline:2px dashed var(--dim);outline-offset:5px}
  .letter{display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;
          border:3px solid var(--maize);color:var(--maize);font-weight:800}
  .revealed .opt{opacity:.3}
  .revealed .opt.right{opacity:1;border-color:var(--maize)}
  .revealed .opt.right .letter{background:var(--maize);color:var(--bg)}

  /* which groups held up each letter */
  .chips{grid-column:2;display:flex;flex-wrap:wrap;gap:.4em;font-size:clamp(.8rem,min(1.3vw,2.1vh),1.3rem)}
  .chip{width:2em;height:2em;padding:0;border-radius:50%;font:inherit;font-weight:700;color:var(--muted);
        background:transparent;border:2px solid var(--line);opacity:.6}
  .chip.on{opacity:1;color:var(--bg);background:var(--ink);border-color:var(--ink)}
  .revealed .opt.right .chip.on{background:var(--maize);border-color:var(--maize)}

  .status{flex:none;min-height:clamp(2.6rem,min(7vw,10vh),6.5rem);display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:1vh;text-align:center}
  .status.tall{flex:1}
  .banner{font-size:clamp(1.8rem,min(5.5vw,8.5vh),5.5rem);font-weight:900;color:var(--maize);animation:pop .3s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .note{max-width:60ch;color:var(--dim);font-size:clamp(1rem,min(2vw,3.2vh),2rem)}
  .answer{font-size:clamp(2.6rem,6.5vw,6rem);font-weight:900;line-height:1.1;color:var(--maize)}

  .title{flex:none;font-size:clamp(1.8rem,3.6vw,3.4rem);font-weight:800;color:var(--maize)}

  /* standings */
  .board{flex:none;display:flex;flex-direction:column;gap:1.1vh}
  .row{display:grid;grid-template-columns:4.5em 6.5em 1fr 2.5em;align-items:center;gap:1.4vw;
       font-size:clamp(1.1rem,2.1vw,2rem)}
  .board.bets .row{grid-template-columns:4.5em 6.5em 1fr 2.5em 6.5em}
  .place{color:var(--muted);font-weight:700}
  .gname{font-weight:700}
  .barwrap{height:.85em;overflow:hidden;background:var(--panel);border-radius:6px}
  .barin{display:block;height:100%;background:var(--dim)}
  .pts{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .row.top .place,.row.top .gname,.row.top .pts{color:var(--maize)}
  .row.top .barin{background:var(--maize)}
  .finalcat{flex:none;margin-top:1vh;font-size:clamp(1.5rem,3vw,2.8rem)}
  .finalcat .label{color:var(--muted)}
  .finalcat .cat{font-weight:800}

  /* bets and scoring the final */
  .wager{display:flex;align-items:center;gap:.4em;color:var(--muted)}
  .wager input{width:4em;padding:.2em .4em;font:inherit;font-weight:700;color:var(--ink);
               background:#08111b;border:1px solid var(--line);border-radius:8px}
  .answerline{flex:none;color:var(--dim);font-size:clamp(1.3rem,2.4vw,2.2rem)}
  .answerline b{color:var(--ink)}
  .scoring{display:flex;flex-direction:column;gap:1vh}
  .srow{display:grid;grid-template-columns:6.5em 5.5em 8.5em auto auto 1fr;align-items:center;gap:1.2vw;
        padding:.45em 1em;background:var(--panel);border:1px solid var(--line);border-radius:10px;
        font-size:clamp(1.05rem,1.9vw,1.8rem)}
  .before{color:var(--muted)}
  .after{text-align:right;font-size:1.3em;font-weight:900;font-variant-numeric:tabular-nums}
  .after.up{color:var(--green)}
  .after.down{color:var(--red)}

  /* setup */
  .setup{margin:auto;width:100%;max-width:1040px}
  .setup .title{display:inline-block;padding-bottom:.04em;border-bottom:8px solid var(--maize);
                font-size:clamp(2.6rem,6vw,5.5rem);color:var(--ink)}
  .sub{margin-top:.5em;color:var(--dim);font-size:clamp(1.2rem,2.2vw,2rem)}
  .fields{display:flex;flex-wrap:wrap;gap:28px;margin:5vh 0 2vh}
  .fields label{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:15px}
  .fields input{width:150px;padding:10px 14px;font:inherit;font-size:26px;font-weight:700;color:var(--ink);
                background:#08111b;border:1px solid var(--line);border-radius:10px}
  .fit{margin-bottom:4vh;color:var(--dim);font-size:18px}
  .keys{color:var(--muted);font-size:15px;line-height:2.1}
  .keys b{padding:1px 7px;color:var(--dim);font-weight:600;border:1px solid var(--line);border-radius:5px}

  /* presenter controls: quiet, at the bottom */
  #controls{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
            padding:10px 3vw 12px;background:#09131e;border-top:1px solid var(--line)}
  #controls .left,#controls .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{padding:9px 16px;font-size:15px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:8px}
  .btn:hover{color:var(--ink);border-color:var(--maize)}
  .btn.primary{color:var(--bg);background:var(--maize);border-color:var(--maize);font-weight:700}
  .btn.res{padding:.35em .9em;font-size:.75em}
  .btn.res.on-right{color:var(--bg);background:var(--green);border-color:var(--green);font-weight:700}
  .btn.res.on-wrong{color:var(--bg);background:var(--red);border-color:var(--red);font-weight:700}
  .hint{color:var(--muted);font-size:14px}

  /* scores overlay (T) */
  #overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(6,12,19,.94)}
  #overlay .panel{width:min(1000px,92vw);padding:3vh 3vw;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  #overlay .title{margin-bottom:2vh}
  #overlay .hint{margin-top:2vh}

  @media (max-width:700px){ .opts{grid-template-columns:1fr} .finalbody{flex-direction:column} .clue{max-width:100%} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div id="bar"><div id="barFill"></div></div>
<main id="stage"></main>
<footer id="controls"></footer>
<div id="overlay" class="hidden"></div>

<script>
/* =======================================================================
   TRIVIA NIGHT
   Edit CONFIG, QUESTIONS and FINAL. Everything below "machinery" can be
   left alone.
   ======================================================================= */

const CONFIG = {
  TITLE:             "Trivia Night",
  SUBTITLE:          "Economic history",
  GROUPS:            6,     // default on the setup screen
  SECONDS:           45,    // per question
  FINAL_SECONDS:     60,
  GAME_MINUTES:      20,    // default game length; leave the box blank in the game to play every question
  QUESTION_OVERHEAD: 10,    // seconds per question for reading, the reveal, and entering answers
  FINAL_OVERHEAD:    120,   // seconds set aside for bets and scoring the final
  SOUND:             true,  // beep when time runs out
  SHUFFLE:           true   // new question order each game; the final always comes last
};

// One block per question: the right answer, three wrong ones, and an optional note
// shown with the answer. Write them in any order; each game shuffles the questions
// and the options. Options starting "All of the above", "None of the above", or
// "Trick question" always stay in the last slot.
const QUESTIONS = [
  {
    q:     "What is economic history?",
    right: "The history of past economic events",
    wrong: ["The history of economic thought", "The study of how societies allocate scarce resources", "The use of past data to forecast the economy"],
    note:  "Economic history studies past economies and what happened in them. The history of economic thought studies past ideas about the economy."
  },
  {
    q:     "In 1870, most people...",
    right: "All of the above",
    wrong: ["Were often hungry and cold, hot, or wet", "Had little leisure", "Wore hats"],
    note:  "Work left little time for leisure, homes were too hot or too cold, and going out without a hat was rare."
  },
  {
    q:     "Which of these could a millionaire have in 1870?",
    right: "Refrigeration",
    wrong: ["Electric light", "Telephones", "Antibiotics"],
    note:  "Refrigeration didn't need electricity: ice cut in winter kept food cold for anyone who could pay. Electric refrigerators came in the 20th century."
  },
  {
    q:     "Where did the Industrial Revolution begin?",
    right: "Britain",
    wrong: ["The Netherlands", "The United States", "Germany"],
    note:  "It began in Britain in the mid-1700s, with steam power and textile mills."
  },
  {
    q:     "In the decades after 1870, which country became the center of innovation?",
    right: "The United States",
    wrong: ["Britain", "France", "Japan"],
    note:  "The U.S. took the lead in new technology after 1870, with Germany close behind in chemicals and electrical equipment."
  },
  {
    q:     "According to the Communist Manifesto, how many classes were there before the Industrial Revolution?",
    right: "Tons",
    wrong: ["1", "2", "3"],
    note:  "Earlier societies had \"a manifold gradation of social rank\": lords, vassals, guild-masters, journeymen, apprentices, serfs."
  },
  {
    q:     "According to the Communist Manifesto, how many classes were there after the Industrial Revolution?",
    right: "2",
    wrong: ["1", "3", "Tons"],
    note:  "Bourgeoisie and proletariat: \"two great hostile camps.\""
  },
  {
    q:     "According to the Communist Manifesto, what happens to small shopkeepers and artisans as industry grows?",
    right: "They sink into the proletariat",
    wrong: ["They grow into a stable middle class", "They lead the workers' revolution", "They rise into the bourgeoisie"],
    note:  "They can't compete with large-scale industry, so they sink into the working class. The Manifesto calls them conservative, not revolutionary."
  },
  {
    q:     "According to the Communist Manifesto, the bourgeoisie is driven to ________?",
    right: "Constantly expand",
    wrong: ["Preserve tradition", "Protect national industries", "Raise workers' wages"],
    note:  "The need for ever-wider markets chases the bourgeoisie across the whole globe."
  },
  {
    q:     "For Marx, a factory worker who gets a big raise is...",
    right: "Still alienated, with no control over work or product",
    wrong: ["No longer alienated, now that the pay is fair", "No longer alienated, once the product is affordable", "Alienated only from coworkers who resent the raise"],
    note:  "Alienation isn't about pay. Workers are cut off from their product, their work, their own nature, and each other, whatever the wage. Marx called higher wages \"better payment for the slave.\""
  },
  {
    q:     "A factory worker in 1848 is legally free to quit and work for anyone else. How would Marx and Engels see that freedom?",
    right: "Mostly empty, since the worker must sell labor somewhere or go hungry",
    wrong: ["A real protection, since no one can be forced to work for anyone", "Fair only if it would be chosen behind a veil of ignorance", "Justified if it produces the greatest total happiness"],
    note:  "Legal freedom means little when economic conditions leave no real choice. The other answers are Nozick, Rawls, and the utilitarians."
  },
  {
    q:     "How did Marx and Engels view individual rights?",
    right: "Mostly hollow, given economic realities",
    wrong: ["Inviolable, whatever the consequences", "The first priority of a just society", "Worth it only if they raise happiness"],
    note:  "Rights mean little when economic conditions leave no real choice. The other answers are Nozick, Rawls, and the utilitarians."
  },
  {
    q:     "Utilitarians judge a life by happiness. Marx judged it by...",
    right: "How people spend their time",
    wrong: ["How much people own", "How equal people are", "Which class people belong to"],
    note:  "For Marx, a good life is free, self-directed activity, not just feeling satisfied."
  },
  {
    q:     "Marx and Engels correctly predicted that unregulated capitalism would...",
    right: "Provoke a political backlash",
    wrong: ["Collapse on its own", "Make workers steadily poorer", "Stay mostly in Europe"],
    note:  "They saw the backlash coming. But capitalism didn't collapse on its own, and workers in rich countries got richer, not poorer."
  },
  {
    q:     "In the Manifesto, capitalist crises come from...",
    right: "Producing too much",
    wrong: ["Producing too little", "Bad harvests", "Government meddling"],
    note:  "More goods than can be sold at a profit, not more than people need. In any earlier era, the Manifesto says, that would have seemed absurd."
  },
  {
    q:     "Which Manifesto demand is now standard U.S. policy?",
    right: "A progressive income tax",
    wrong: ["Abolishing inheritance", "Industrial armies for farming", "Abolishing private land"],
    note:  "A progressive income tax was demand #2 of 10. A central bank and free public schools also made the 1848 list."
  },
  {
    q:     "The second industrial revolution was powered mainly by...",
    right: "Electricity and engines",
    wrong: ["Steam and textiles", "Steel manufacturing and mass production", "Refrigeration and antibiotics"],
    note:  "Electricity and the internal combustion engine were the general-purpose technologies. Mass production came downstream, once electric motors reached the factory floor."
  },
  {
    q:     "Which of these is exponential growth?",
    right: "Growing 1% a year, every year",
    wrong: ["Adding $1 trillion every year", "Growing 50% once, then holding steady", "Growing 20%, then 10%, then 5%"],
    note:  "Exponential means growing by a steady percentage, however small. A fixed trillion a year never compounds."
  },
  {
    q:     "At 2% growth a year, about how long until living standards double?",
    right: "36 years",
    wrong: ["50 years", "72 years", "144 years"],
    note:  "Divide 72 by the growth rate: at 2%, about 36 years. Fifty years assumes the economy adds the same amount every year."
  },
  {
    q:     "Which of these helped the US industrialize quickly after 1870?",
    right: "Immigration",
    wrong: ["Lower wages than Britain", "Free trade with Europe", "Government-run industry"],
    note:  "The U.S. stayed largely open to European immigrants until the 1920s. Immigrants supplied workers and a big share of inventors and founders, like Bell, Tesla, and Carnegie. Higher U.S. wages are what drew them."
  },
  {
    q:     "Which was NOT one of Hausman's reasons for the US lead?",
    right: "A strong central government",
    wrong: ["Its huge size", "A fluid class structure", "Good public schools"],
    note:  "The 19th-century federal government was small. His reasons included size, natural resources, a fluid class structure (for white men), and public schools outside the South."
  },
  {
    q:     "In 1870, food eaten at home took about how much of the household budget?",
    right: "Nearly half",
    wrong: ["About a tenth", "About a quarter", "About three-quarters"],
    note:  "Nearly half of household spending went to food eaten at home. With consumption at about 76% of GDP, that's roughly a third of the whole economy. Today it's well under a tenth of spending."
  },
  {
    q:     "A quarter of people die at birth, and the rest live to 80. What is life expectancy?",
    right: "60",
    wrong: ["20", "40", "80"],
    note:  "Three-quarters live to 80 and a quarter count as zero: 0.75 \u00d7 80 = 60. Splitting the difference only works when it's half and half."
  },
  {
    q:     "In the 1870s, which everyday food was a major killer of young children?",
    right: "Milk",
    wrong: ["Pork", "Canned food", "Bread"],
    note:  "Unpasteurized milk spread tuberculosis, typhoid, and deadly infant diarrhea, and city milk was often watered down or came from sick cows. Pasteurization didn't become standard until the early 1900s."
  },
  {
    q:     "Which of Hausman's reasons for low life expectancy applied mainly to the South?",
    right: "Mosquito-borne disease",
    wrong: ["Poor sanitation", "Industrial accidents", "Poor diet"],
    note:  "Malaria and yellow fever, spread by mosquitoes, hit the South hardest. The rest of his list applied nationwide, with accidents concentrated where the industry was."
  },
  {
    q:     "Why did people in 1870 prefer coffee or alcohol over water?",
    right: "Waterborne disease",
    wrong: ["Cultural preference", "Availability", "Trick question; they didn't"],
    note:  "Untreated water spread cholera and typhoid. Coffee and beer both start with boiled water, which kills germs."
  },
  {
    q:     "Compared to urban life, rural living...",
    right: "Was socially isolated",
    wrong: ["Had more disease", "Had more free time", "Had less to eat"],
    note:  "Farm families often lived miles from neighbors, with no phone, slow mail, and bad roads. They were healthier and better fed than city dwellers, but the work never stopped."
  },
  {
    q:     "What was a \"mail order catalog\"?",
    right: "The Amazon of its day",
    wrong: ["The Yelp of its day", "The Wikipedia of its day", "The UPS of its day"],
    note:  "Montgomery Ward (1872) and Sears (1888) sold everything from clothes to farm tools by mail. Rural Free Delivery (1896) and parcel post (1913) brought the orders right to the farm."
  },
  {
    q:     "McCloskey says to avoid jargon and complex writing, except when...",
    right: "You want to hide what you mean",
    wrong: ["Writing for academics", "You need to impress", "The subject is complicated"],
    note:  "Only when the goal is to obscure, like a politician using a lot of words to say very little. Otherwise write plainly, even about hard subjects."
  },
  {
    q:     "In 1870, what share of American workers worked in farming?",
    right: "Nearly half",
    wrong: ["About a tenth", "About a quarter", "About three-quarters"],
    note:  "46% of workers farmed in 1870, even though 75% of Americans lived in rural areas. Today it's about 1%."
  },
  {
    q:     "In 1870, what share of men in their sixties were still working?",
    right: "About 95%",
    wrong: ["About 40%", "About 60%", "About 75%"],
    note:  "With no pensions or Social Security, men worked until they physically couldn't. Today, about 60% of men in their early sixties work."
  },
  {
    q:     "What did you need to practice medicine in 1870?",
    right: "Nothing at all",
    wrong: ["A medical degree", "A state license", "An apprenticeship"],
    note:  "There was no licensing in 1870; states added it gradually afterward. Harvard's president called the average medical graduate's incompetence \"horrible to contemplate.\""
  },
  {
    q:     "What was the \"American system\" that stunned visitors at London's 1851 Crystal Palace?",
    right: "Interchangeable parts",
    wrong: ["The moving assembly line", "Piece-rate pay", "Water-powered mills"],
    note:  "Colt's revolvers were built from interchangeable parts, a method that became known as the American system. The moving assembly line came with Ford in 1913."
  }
];

// The wager question: open-ended, no options.
const FINAL = {
  category: "The Communist Manifesto",
  q:        "Finish the Manifesto's line: the bourgeoisie produces, above all, its own ________.",
  answer:   "Grave-diggers",
  note:     "\"What the bourgeoisie therefore produces, above all, are its own grave-diggers.\" By gathering workers together, industry creates the class that will bury it.",
  image:    "digger"   // optional picture shown with the question; it lives in IMAGES at the bottom of the file
};

/* =============================== machinery =============================== */

const PINNED = /^(all of the above|none of the above|trick question)/i;   // options that always go last
const letter = i => String.fromCharCode(65 + i);                          // 0 is A, 1 is B, and so on
const $   = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let S = { phase: "setup" };    // the whole game lives here
let last = { groups: CONFIG.GROUPS, section: "", seconds: CONFIG.SECONDS, finalSeconds: CONFIG.FINAL_SECONDS, minutes: CONFIG.GAME_MINUTES };
let tick = null;
let audio = null;

/* ---------- building a game ---------- */

// a fresh random order (Fisher-Yates)
function shuffled(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
// one question with its options shuffled; "all of the above" and the like stay last
function prepare(item) {
  const all     = [item.right, ...item.wrong];
  const pinned  = all.filter(o => PINNED.test(o));
  const loose   = all.filter(o => !PINNED.test(o));
  const options = shuffled(loose).concat(pinned);
  return { q: item.q, note: item.note, options, answer: options.indexOf(item.right) };
}
// how many questions fit in the time, after setting aside time for the final
function questionsThatFit(minutes, seconds, finalSeconds) {
  if (!minutes) return QUESTIONS.length;
  const budget = minutes * 60 - (finalSeconds + CONFIG.FINAL_OVERHEAD);
  const n = Math.floor(budget / (seconds + CONFIG.QUESTION_OVERHEAD));
  return Math.max(1, Math.min(QUESTIONS.length, n));
}
// the numbers in the setup boxes, with sensible fallbacks
function setupNumbers() {
  return {
    groups:       Math.max(2, Math.min(12, Math.round(Number($("inGroups").value)) || CONFIG.GROUPS)),
    section:      $("inSection").value.trim(),
    seconds:      Math.max(5, Math.round(Number($("inSecs").value)) || CONFIG.SECONDS),
    finalSeconds: Math.max(5, Math.round(Number($("inFinal").value)) || CONFIG.FINAL_SECONDS),
    minutes:      Math.max(0, Math.round(Number($("inMinutes").value)) || 0)
  };
}
function updateFit() {
  const v = setupNumbers();
  const n = questionsThatFit(v.minutes, v.seconds, v.finalSeconds);
  $("fit").textContent = v.minutes
    ? `${v.minutes} minutes fits ${n} of ${QUESTIONS.length} questions, plus the final.`
    : `No game length set: all ${QUESTIONS.length} questions, plus the final.`;
}
function wireSetup() {
  ["inGroups", "inSecs", "inFinal", "inMinutes"].forEach(id => $(id).addEventListener("input", updateFit));
  updateFit();
}

/* ---------- scores ---------- */

function groupList() {
  return Array.from({ length: S.groups }, (_, g) => g);
}
function correctIndex(q) {
  return S.qs[q].answer;
}
function countRight(q) {
  const c = correctIndex(q);
  return S.answers[q].filter(x => x === c).length;
}
// a question counts once its answer has been revealed
function baseScore(g) {
  let s = 0;
  S.answers.forEach((a, q) => { if (S.revealed[q] && a[g] === correctIndex(q)) s++; });
  return s;
}
// a bet can't be negative or bigger than the group's score
function wagerFor(g) {
  const w = Math.floor(Number(S.final[g].wager) || 0);
  return Math.max(0, Math.min(w, baseScore(g)));
}
function totalScore(g) {
  const r = S.final[g].result;
  if (r === "right") return baseScore(g) + wagerFor(g);
  if (r === "wrong") return baseScore(g) - wagerFor(g);
  return baseScore(g);
}
// highest first; tied groups share a place
function ranked(scoreOf) {
  const rows = groupList().map(g => ({ g, score: scoreOf(g) }));
  rows.sort((a, b) => b.score - a.score || a.g - b.g);
  for (const r of rows) {
    r.place = 1 + rows.filter(o => o.score > r.score).length;
    r.tie   = rows.filter(o => o.score === r.score).length > 1;
  }
  return rows;
}
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ---------- saving the results ---------- */

// one row per group per question played, plus one row per group for the final
function resultsCSV(stamp) {
  const cell = v => { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const rows = [["timestamp", "section", "group", "question_no", "question", "chose_letter", "chose_answer",
                 "correct_letter", "correct_answer", "correct", "points", "wager", "total_score"]];
  for (const g of groupList()) {
    const total = totalScore(g);
    S.qs.forEach((Q, q) => {
      const a = S.answers[q][g];
      if (!S.revealed[q] && S.answers[q].every(x => x === null)) return;   // never got to this one
      const right = a !== null && a === Q.answer;
      rows.push([stamp, S.section, g + 1, q + 1, Q.q,
                 a === null ? "" : letter(a), a === null ? "" : Q.options[a],
                 letter(Q.answer), Q.options[Q.answer],
                 S.revealed[q] ? (right ? "TRUE" : "FALSE") : "",
                 S.revealed[q] ? (right ? 1 : 0) : "",
                 "", total]);
    });
    const f = S.final[g], w = wagerFor(g);
    rows.push([stamp, S.section, g + 1, "final", FINAL.q, "", "", "", FINAL.answer,
               f.result === "right" ? "TRUE" : f.result === "wrong" ? "FALSE" : "",
               f.result === "right" ? w : f.result === "wrong" ? -w : 0,
               f.wager === "" ? "" : w, total]);
  }
  return "\ufeff" + rows.map(r => r.map(cell).join(",")).join("\n") + "\n";
}
// save as trivia_sec002_2026-10-09_1047.csv in the browser's Downloads folder
function downloadResults() {
  const now = new Date(), pad = n => String(n).padStart(2, "0");
  const day   = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const time  = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const name  = `trivia_${S.section ? "sec" + S.section + "_" : ""}${day}_${time.replace(":", "")}.csv`;
  const blob  = new Blob([resultsCSV(`${day} ${time}`)], { type: "text/csv" });
  const link  = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  S.exported = name;
  if (S.phase === "final-standings") render();
}

/* ---------- timer ---------- */

function startTimer(seconds) {
  stopTimer();
  S.timer = { total: seconds, remaining: seconds, end: Date.now() + seconds * 1000, running: true };
  tick = setInterval(updateTimer, 100);
  updateTimer();
}
function stopTimer() {
  clearInterval(tick);
  tick = null;
  if (S.timer) S.timer.running = false;
}
function pauseResume() {
  const t = S.timer;
  if (!t || !(S.phase === "answering" || S.phase === "final-q")) return;
  if (t.running) {
    t.remaining = Math.max(0, (t.end - Date.now()) / 1000);
    stopTimer();
  } else {
    t.end = Date.now() + t.remaining * 1000;
    t.running = true;
    tick = setInterval(updateTimer, 100);
  }
  updateTimer();
  renderControls();
}
function updateTimer() {
  const t = S.timer;
  if (!t) return;
  if (t.running) t.remaining = Math.max(0, (t.end - Date.now()) / 1000);
  const low = t.remaining <= 10;
  const clock = $("clock");
  if (clock) {
    clock.textContent = Math.ceil(t.remaining);
    clock.className = "clock" + (t.running ? (low ? " low" : "") : " paused");
  }
  const fill = $("barFill");
  fill.style.width = (100 * t.remaining / t.total) + "%";
  fill.classList.toggle("low", low);
  if (t.running && t.remaining <= 0) timeUp();
}
// time ran out, or the presenter called it early
function timeUp() {
  stopTimer();
  if (S.timer) S.timer.remaining = 0;
  S.phase = (S.phase === "final-q") ? "final-down" : "show";
  beep();
  render();
}

/* ---------- sound ---------- */

function unlockAudio() {
  if (!CONFIG.SOUND) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
}
function beep() {
  if (!CONFIG.SOUND || !audio) return;
  try {
    const t0 = audio.currentTime, osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + 0.65);
  } catch (e) {}
}

/* ---------- game flow ---------- */

function startGame() {
  const v = setupNumbers();
  last = v;
  const n    = questionsThatFit(v.minutes, v.seconds, v.finalSeconds);
  const pool = CONFIG.SHUFFLE ? shuffled(QUESTIONS) : QUESTIONS.slice();
  const qs   = pool.slice(0, n).map(prepare);
  S = {
    phase:        "answering",
    groups:       v.groups,
    section:      v.section,
    seconds:      v.seconds,
    finalSeconds: v.finalSeconds,
    q:            0,
    qs:           qs,                                         // this game's questions, options shuffled
    answers:      qs.map(() => Array(v.groups).fill(null)),   // answers[q][g]: the option a group held up
    revealed:     qs.map(() => false),
    pick:         null,                                       // the letter being entered
    final:        Array.from({ length: v.groups }, () => ({ wager: "", result: null })),
    timer:        null,
    scores:       false,
    exported:     ""                                          // name of the results file, once saved
  };
  unlockAudio();
  startQuestion();
}
function startQuestion() {
  stopTimer();
  S.timer = null;
  S.pick = null;
  S.phase = "answering";
  render();
  startTimer(S.seconds);
}
function reveal() {
  S.revealed[S.q] = true;
  S.pick = null;          // drop the dashed outline so only the right answer stands out
  S.phase = "revealed";
  render();
}
function next() {
  if (S.q < S.qs.length - 1) {
    S.q++;
    startQuestion();
  } else {
    S.pick = null;
    S.phase = "standings";
    render();
  }
}
function back() {
  if (["answering", "show", "revealed"].includes(S.phase) && S.q > 0) {
    stopTimer();
    S.q--;
    S.phase = S.revealed[S.q] ? "revealed" : "show";
  } else if (S.phase === "standings") {
    S.phase = S.revealed[S.q] ? "revealed" : "show";
  } else if (S.phase === "final-standings") {
    S.phase = "final-scoring";
  } else {
    return;
  }
  S.pick = null;
  render();
}
function skipToFinal() {
  stopTimer();
  S.timer = null;
  S.pick = null;
  S.phase = "standings";
  render();
}
function startFinal() {
  stopTimer();
  S.timer = null;
  S.phase = "final-q";
  render();
  startTimer(S.finalSeconds);
}
function revealFinal()      { S.phase = "final-answer";    render(); }
function toScoring()        { S.phase = "final-scoring";   render(); }
function toFinalStandings() {
  S.phase = "final-standings";
  if (!S.exported) downloadResults();
  render();
}
function newGame() {
  if (!confirm("Start a new game? This clears every score.")) return;
  stopTimer();
  S = { phase: "setup" };
  render();
}
// what Space, Enter, the right arrow, or a clicker does at each step
function primary() {
  switch (S.phase) {
    case "answering":     return timeUp();
    case "show":          return reveal();
    case "revealed":      return next();
    case "standings":     return startFinal();
    case "final-q":       return timeUp();
    case "final-down":    return revealFinal();
    case "final-answer":  return toScoring();
    case "final-scoring": return toFinalStandings();
  }
}
function toggleScores() {
  if (S.phase === "setup") return;
  S.scores = !S.scores;
  renderOverlay();
}
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

/* ---------- entering what each group held up ---------- */

function entering() {
  return S.phase === "show" || S.phase === "revealed";
}
function pickOption(i) {
  if (!entering() || i >= S.qs[S.q].options.length) return;
  S.pick = i;
  renderEntry();
}
// put group g on option i; if it's already there, take it off
function assign(g, i) {
  if (!entering() || g >= S.groups) return;
  const a = S.answers[S.q];
  a[g] = (a[g] === i) ? null : i;
  S.pick = i;
  renderEntry();
}
function assignKey(g) {
  if (S.pick !== null) assign(g, S.pick);
}
function allOnPick() {
  if (!entering() || S.pick === null) return;
  S.answers[S.q].fill(S.pick);
  renderEntry();
}
function clearAnswers() {
  if (!entering()) return;
  S.answers[S.q].fill(null);
  renderEntry();
}
// update the chips in place, so the banner doesn't replay on every click
function renderEntry() {
  const a = S.answers[S.q];
  document.querySelectorAll(".opt").forEach((card, i) => {
    card.classList.toggle("pick", S.pick === i);
    card.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("on", a[Number(ch.dataset.g)] === i));
  });
  renderControls();
}

/* ---------- screens ---------- */

function render() {
  const fill = $("barFill");
  fill.style.width = "0%";
  fill.classList.remove("low");

  const st = $("stage");
  st.classList.toggle("revealed", S.phase === "revealed");
  if (S.phase === "setup") { st.innerHTML = setupHTML(); wireSetup(); }
  else if (["answering", "show", "revealed"].includes(S.phase)) st.innerHTML = questionHTML();
  else if (S.phase === "standings") { st.innerHTML = standingsHTML(); wireBets(); }
  else if (["final-q", "final-down", "final-answer"].includes(S.phase)) st.innerHTML = finalHTML();
  else if (S.phase === "final-scoring") { st.innerHTML = scoringHTML(); wireBets(); wireResults(); }
  else if (S.phase === "final-standings") st.innerHTML = resultsHTML();

  renderControls();
  renderOverlay();
}

function setupHTML() {

        <label>Section <input id="inSection" type="text" placeholder="002" value="${esc(last.section)}"></label>
        <label>Seconds per question <input id="inSecs" type="number" min="5" value="${last.seconds}"></label>
        <label>Seconds for the final <input id="inFinal" type="number" min="5" value="${last.finalSeconds}"></label>

      </div>

function wireBets() {

function resultsHTML() {

// a bar per group, highest first, with places (ties share one), and bet boxes if asked

function renderControls() {
  const btn = (label, fn, cls = "") => `<button class="btn ${cls}" onclick="${fn}">${label}</button>`;
  const t = S.timer;
  const paused = !!t && !t.running && t.remaining > 0;
  let lhs = "", rhs = "";

  switch (S.phase) {
    case "setup":
      rhs = btn("Start", "startGame()", "primary");
      break;
    case "answering":
      lhs = btn(paused ? "Resume" : "Pause", "pauseResume()");
      rhs = (S.q > 0 ? btn("Back", "back()") : "") + btn("Call time", "timeUp()", "primary");
      break;
    case "show":
    case "revealed": {
      const a = S.answers[S.q];
      const missing = groupList().filter(g => a[g] === null).map(g => g + 1);
      let msg = "";
      if (S.phase === "revealed") msg += `Got it right: ${countRight(S.q)} of ${S.groups}. `;
      msg += S.pick === null ? "Press a letter, then group numbers. " : `Entering ${letter(S.pick)}. `;
      msg += missing.length ? `Not entered: ${missing.join(", ")}.` : "Every group entered.";
      lhs = `<span class="hint">${msg}</span>` +
            (S.pick !== null ? btn(`All on ${letter(S.pick)}`, "allOnPick()") : "") +
            btn("Clear answers", "clearAnswers()");
      rhs = (S.q > 0 ? btn("Back", "back()") : "") +
            (S.phase === "show"
              ? btn("Reveal answer", "reveal()", "primary")
              : btn(S.q < S.qs.length - 1 ? "Next question" : "Go to the final", "next()", "primary"));
      break;
    }
    case "standings":
      lhs = `<span class="hint">Collect the slips and type each group's bet, then show the question.</span>`;
      rhs = btn("Back", "back()") + btn("Show the final question", "startFinal()", "primary");
      break;
    case "final-q":
      lhs = btn(paused ? "Resume" : "Pause", "pauseResume()");
      rhs = btn("Call time", "timeUp()", "primary");
      break;
    case "final-down":
      rhs = btn("Reveal answer", "revealFinal()", "primary");
      break;
    case "final-answer":
      rhs = btn("Score the final", "toScoring()", "primary");
      break;
    case "final-scoring":
      lhs = `<span class="hint">Starting from last place, tap Right or Wrong for each group; tap again to undo. Bets can still be fixed here.</span>`;
      rhs = btn("Show final standings", "toFinalStandings()", "primary");
      break;
    case "final-standings":
      rhs = btn("Back", "back()") + btn("Download results", "downloadResults()") + btn("New game", "newGame()");
      break;
  }
  const inQuestions = ["answering", "show", "revealed"].includes(S.phase);
  const lastShown = S.phase === "revealed" && S.q === S.qs.length - 1;   // "Go to the final" covers it
  const util = (inQuestions && !lastShown ? btn("Skip to the final", "skipToFinal()") : "") +
               (S.phase === "setup" ? "" : btn("Scores", "toggleScores()")) +
               btn("Full screen", "toggleFullscreen()");
  $("controls").innerHTML = `<div class="left">${lhs}</div><div class="right">${util}${rhs}</div>`;
}

function renderOverlay() {
  const o = $("overlay");
  if (!S.scores || S.phase === "setup") {
    o.classList.add("hidden");
    return;
  }
  o.innerHTML = `<div class="panel"><div class="title">Scores</div>${boardHTML(ranked(totalScore), false, false)}
    <div class="hint">Press any key or click to close</div></div>`;
  o.classList.remove("hidden");
}

/* ---------- keys and clicks ---------- */

document.addEventListener("keydown", e => {
  const k = e.key;
  if (e.target.tagName === "INPUT") {            // typing a number: leave keys alone
    if (k === "Enter") {
      if (S.phase === "setup") startGame();
      else e.target.blur();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "BUTTON" && (k === " " || k === "Enter")) return;   // a tabbed-to button handles itself
  if (S.scores) {                                // any key closes the scores
    e.preventDefault();
    S.scores = false;
    renderOverlay();
    return;
  }
  if (k === "f" || k === "F") return toggleFullscreen();
  if (S.phase === "setup") {
    if (k === "Enter") startGame();
    return;
  }
  if (k === " " || k === "Enter" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); primary(); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); back(); }
  else if (/^[a-d]$/i.test(k))                  pickOption("abcd".indexOf(k.toLowerCase()));
  else if (/^[0-9]$/.test(k))                   assignKey(k === "0" ? 9 : Number(k) - 1);
  else if (k === "e" || k === "E")              allOnPick();
  else if (k === "x" || k === "X")              clearAnswers();
  else if (k === "p" || k === "P")              pauseResume();
  else if (k === "t" || k === "T")              toggleScores();
});

// clicked buttons let go of focus, so Space keeps meaning "next step"
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) b.blur();
});
$("overlay").addEventListener("click", toggleScores);

document.title = CONFIG.TITLE;
render();
</script>
